[package]
name = "reqtool"
version = "1.0.0"
description = "Main compiler for the req language and tools associated"
edition = "2024"

[package.metadata]
author = "Sami Dahoux <sami@qitab.io>"
copyright = "© 2025-2026. All rights reserved. Sami Dahoux"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
itertools = "0.14.0"
pest = "2.7.9"
pest_derive = "2.7.9"
pretty_assertions = "1.4.1"
thiserror = "2.0.18"
unindent = "0.2.4"

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "parsing"
harness = false

[lib]
name = "reqtool"
path = "src/lib/mod.rs"
crate-type = ["lib"]

[profile.profiling]
inherits = "release"
debug = true
