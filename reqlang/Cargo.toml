[package]
name = "reqlang"
version.workspace = true
description = "req language official core library"
edition = "2024"

[package.metadata]
author = "Sami Dahoux <sami@qitab.io>"
copyright = "© 2025-2026. All rights reserved. Sami Dahoux"

[dependencies]
markdown = "1.0.0"
pretty_assertions = "1.4.1"
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }
pretty_assertions = "1.4.1"
unindent = "0.2.4"

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "references"
harness = false

[lib]
name = "reqlang"
path = "src/lib/mod.rs"
crate-type = ["lib"]

